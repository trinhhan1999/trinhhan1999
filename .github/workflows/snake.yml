name: Generate Snake

on:
  # Tự động chạy vào nửa đêm mỗi ngày
  schedule:
    - cron: "0 0 * * *" 
  
  # Cho phép chạy thủ công bằng nút bấm
  workflow_dispatch:
  
  # Chạy mỗi khi push lên nhánh main (hoặc master)
  push:
    branches:
    - master
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: trinhhan1999
          # Tạo ra file svg con rắn
          svg_out_path: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # Đẩy file ảnh vào nhánh tên là 'output'
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
